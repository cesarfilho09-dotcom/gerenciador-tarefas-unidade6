<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas - Vue</title>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    h1, h2, h3 { margin-top: 0; }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: 0;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .erro {
      padding: 10px;
      margin-top: 15px;
      border-radius: 5px;
      background: #f8d7da;
      color: #721c24;
    }
    .carregando { color: #555; }
    .tarefa {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 10px;
      border-radius: 8px;
    }
    .tarefa.concluida {
      background: #e8f5e9;
    }
    .status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
    }
    .pendente {
      background: #fff3cd;
      color: #856404;
    }
    .concluida {
      background: #d4edda;
      color: #155724;
    }
    .menu {
  max-width: 900px;
  margin: 0 auto 20px;
  padding: 15px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.menu a {
  color: #007bff;
  text-decoration: none;
  font-weight: bold;
}

.menu a:hover {
  text-decoration: underline;
}
  </style>
</head>

<body>
  <nav class="menu">
  <a href="#/">Inicial</a>
  <a href="#/detalhes">Detalhes</a>
  <a href="#/login">Login</a>
  <a href="#/admin">Admin</a>
  <a href="#/objetos">Objetos</a>
  <a href="#/objeto">Objeto</a>
  <a href="#/usuarios">Usuários</a>
  <a href="#/autor">Autor</a>
</nav>
  <div id="app" class="container">

    <router-view></router-view>


  </div>

<script src="/js/router.js"></script>

  <script>
    const { createApp } = Vue;

    const app = createApp({
      data() {
        return {
          tarefas: [],
          titulo: "",
          descricao: "",
          carregando: false,
          erro: ""
        };
      },

      mounted() {
        this.carregarTarefas();
      },

      methods: {
        // Carregar tarefas via fetch
        async carregarTarefas() {
          this.carregando = true;
          this.erro = "";

          try {
            const resposta = await fetch("/tarefas/vue/tarefas");

            if (!resposta.ok) {
              throw new Error("Não foi possível carregar as tarefas.");
            }

            this.tarefas = await resposta.json();
          } catch (erro) {
            this.erro = erro.message;
          } finally {
            this.carregando = false;
          }
        },

        // Cadastrar tarefa via fetch
        async cadastrarTarefa() {
          this.erro = "";

          if (!this.titulo.trim()) {
            this.erro = "Digite o título da tarefa.";
            return;
          }

          try {
            const resposta = await fetch("/tarefas/vue/tarefas", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                titulo: this.titulo,
                descricao: this.descricao
              })
            });

            const dados = await resposta.json();

            if (!resposta.ok) {
              throw new Error(dados.erro || "Erro ao cadastrar tarefa.");
            }

            this.titulo = "";
            this.descricao = "";

            await this.carregarTarefas();
          } catch (erro) {
            this.erro = erro.message;
          }
        },

        // Alternar status da tarefa via fetch
        async alternarStatus(tarefa) {
          this.erro = "";

          try {
            const resposta = await fetch(
              `/tarefas/vue/tarefas/${tarefa.id}/status`,
              {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  status: tarefa.status === "pendente"
                    ? "concluida"
                    : "pendente"
                })
              }
            );

            const dados = await resposta.json();

            if (!resposta.ok) {
              throw new Error(dados.erro || "Erro ao alterar o status.");
            }

            await this.carregarTarefas();
          } catch (erro) {
            this.erro = erro.message;
          }
        }
      }
        });

    app.use(router);

    app.mount("#app");
  </script>
</body>
</html>
